name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # En cas d'échec, les erreurs sont publiées dans un ticket du dépôt.
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|Missing class" -A4 build.log | head -200 > errors.txt || true
          [ -s errors.txt ] || tail -150 build.log > errors.txt
          gh issue create --title "Échec de compilation ${GITHUB_SHA::7}" --body-file errors.txt

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk OrbitIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitIPTV-apk
          path: OrbitIPTV.apk

      # Publie l'APK avec un lien direct stable :
      # https://github.com/<compte>/<dépôt>/releases/latest/download/OrbitIPTV.apk
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OrbitIPTV.apk \
            --title "Orbit IPTV (dernière version)" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}. Fonctionne sur smartphone Android et Android TV." \
            --latest
