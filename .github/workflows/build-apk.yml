name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk OrbitIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitIPTV-apk
          path: OrbitIPTV.apk

      # Publie l'APK avec un lien direct stable :
      # https://github.com/<compte>/<dépôt>/releases/latest/download/OrbitIPTV.apk
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OrbitIPTV.apk \
            --title "Orbit IPTV (dernière version)" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}. Fonctionne sur smartphone Android et Android TV." \
            --latest
